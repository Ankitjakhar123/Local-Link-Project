    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LocalLink - Home Services at Your Doorstep" />
    <meta property="og:description" content="Book trusted, professional services for all your home needs. Quality service guaranteed." />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:url" content="https://locallink.com" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Performance optimizations -->
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/fonts/SpaceGrotesk-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/images/hero-bg.webp" as="image" />
    
    <!-- Critical CSS -->
    <style>
      /* Critical CSS for above-the-fold content */
      /* This helps prevent layout shifts during page load */
      :root {
        --background: 220 30% 4%;
        --foreground: 230 40% 98%;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: hsl(var(--background));
        z-index: 9999;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: hsl(260 80% 55%);
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading screen that will be replaced by React -->
      <div class="loading-screen">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/serviceWorker.js')
            .then(registration => {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- Prevent Flash of Unstyled Content -->
    <script>
      // Add dark class immediately to prevent flash
      document.documentElement.classList.add('dark');
      
      // Handle loading performance measurement
      window.addEventListener('load', function() {
        // Hide loading screen when page is fully loaded
        const loadingScreen = document.querySelector('.loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }
        
        // Measure and log performance metrics
        if (window.performance && console) {
          const timing = window.performance.timing;
          console.log('Page load time: ' + (timing.loadEventEnd - timing.navigationStart) + 'ms');
        }
      });
    </script>
  </body>
</html>
